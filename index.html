<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern History Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-container">
        <div id="calculator">
            <input id="display" readonly placeholder="0">
            <div id="keys">
                <button onclick="clearDisplay()" class="clear-btn">C</button>
                <button onclick="appendToDisplay('/')" class="operator-btn">÷</button>
                <button onclick="appendToDisplay('*')" class="operator-btn">×</button>
                <button onclick="appendToDisplay('-')" class="operator-btn">−</button>
                
                <button onclick="appendToDisplay('7')">7</button>
                <button onclick="appendToDisplay('8')">8</button>
                <button onclick="appendToDisplay('9')">9</button>
                <button onclick="appendToDisplay('+')" class="operator-btn">+</button>
                
                <button onclick="appendToDisplay('4')">4</button>
                <button onclick="appendToDisplay('5')">5</button>
                <button onclick="appendToDisplay('6')">6</button>
                <button onclick="calculate()" class="equals-btn">=</button>
                
                <button onclick="appendToDisplay('1')">1</button>
                <button onclick="appendToDisplay('2')">2</button>
                <button onclick="appendToDisplay('3')">3</button>
                <button onclick="appendToDisplay('.')">.</button>
                
                <button onclick="appendToDisplay('0')" class="zero-btn">0</button>
            </div>
        </div>

        <div id="history-panel">
            <h3>History</h3>
            <div id="history-list"></div>
            <button onclick="clearHistory()" class="clear-history-btn">Clear History</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
